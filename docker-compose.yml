services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: api-1
      ConnectionStrings__WarehouseDb: Host=postgres;Port=5432;Database=warehouse;Username=warehouse_app;Password=warehouse_app_secret
      Swagger__Enabled: "true"
      Jwt__Issuer: warehouse-auth
      Jwt__Audience: warehouse-wms
      Jwt__Key: warehouse-demo-jwt-signing-key-32chars!!
    depends_on:
      postgres:
        condition: service_healthy

  api-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: api-2
      ConnectionStrings__WarehouseDb: Host=postgres;Port=5432;Database=warehouse;Username=warehouse_app;Password=warehouse_app_secret
      Swagger__Enabled: "true"
      Jwt__Issuer: warehouse-auth
      Jwt__Audience: warehouse-wms
      Jwt__Key: warehouse-demo-jwt-signing-key-32chars!!
    depends_on:
      postgres:
        condition: service_healthy

  api-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      INSTANCE_ID: api-3
      ConnectionStrings__WarehouseDb: Host=postgres;Port=5432;Database=warehouse;Username=warehouse_app;Password=warehouse_app_secret
      Swagger__Enabled: "true"
      Jwt__Issuer: warehouse-auth
      Jwt__Audience: warehouse-wms
      Jwt__Key: warehouse-demo-jwt-signing-key-32chars!!
    depends_on:
      postgres:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:v12.2.3
    volumes:
      - ./postgrest/postgrest.conf:/etc/postgrest.conf:ro
    command: postgrest /etc/postgrest.conf
    depends_on:
      postgres:
        condition: service_healthy
      api-1:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_POSTGREST_URL: /rest
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_POSTGREST_URL: /rest

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - postgrest
      - frontend

volumes:
  postgres_data:
