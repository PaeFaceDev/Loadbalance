upstream warehouse_api {
    least_conn;
    server api-1:8080 max_fails=3 fail_timeout=30s;
    server api-2:8080 max_fails=3 fail_timeout=30s;
    server api-3:8080 max_fails=3 fail_timeout=30s;
}

upstream warehouse_postgrest {
    server postgrest:3000;
}

upstream warehouse_frontend {
    server frontend:3000;
}

server {
    listen 80;
    client_max_body_size 10m;

    location /health {
        access_log off;
        proxy_pass http://warehouse_api/health/live;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://warehouse_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /rest/ {
        proxy_pass http://warehouse_postgrest/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /swagger {
        proxy_pass http://warehouse_api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://warehouse_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
